# Render blueprint for the NextFour backend.
# Secrets are marked `sync: false` — Render prompts for them, they are never stored here.
services:
  - type: web
    name: nextfour-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    # --include=dev is required: NODE_ENV=production (below) makes npm omit
    # devDependencies, and typescript lives there. Without it tsc is absent,
    # the build fails, and dist/ never exists.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.23.2"
      - key: NODE_ENV
        value: production
      # Set in the Render dashboard. PORT is injected by Render — do not set it.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
